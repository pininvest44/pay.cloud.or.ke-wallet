<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bulk STK Push Dispatcher</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h2>Bulk STK Push Dispatcher</h2>
    <p class="rate-notice">⚡ Rate Limit: 30 requests / minute (Automated 2s interval)</p>

    <form id="bulkForm">
      <div class="form-group">
        <label for="phoneNumbers">Phone Numbers (One per line or comma-separated)</label>
        <textarea id="phoneNumbers" rows="6" placeholder="0712345678&#10;0787654321&#10;254700000000" required></textarea>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="amount">Amount (KES)</label>
          <input type="number" id="amount" min="1" placeholder="500" required />
        </div>
        <div class="form-group">
          <label for="reference">Reference / Account Number (Optional)</label>
          <input type="text" id="reference" placeholder="521813" />
        </div>
      </div>

      <button type="submit" id="submitBtn">Start Bulk STK Push</button>
    </form>

    <div id="progressContainer" class="hidden">
      <h3>Processing Progress</h3>
      <div class="progress-bar-bg">
        <div id="progressBar" class="progress-bar-fill"></div>
      </div>
      <p id="progressText">0 / 0 Processed</p>

      <table id="logTable">
        <thead>
          <tr>
            <th>#</th>
            <th>Phone</th>
            <th>Amount</th>
            <th>Status</th>
            <th>Details</th>
          </tr>
        </thead>
        <tbody id="logBody"></tbody>
      </table>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
